name: Build T-Call A7670 V1.0 firmware

on:
  workflow_dispatch:

jobs:
  firmware:
    name: Build firmware.bin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build T-Call A7670 V1.0 firmware
        run: pio run -e T-Call-A7670X-V1-0

      - name: Upload OTA firmware
        uses: actions/upload-artifact@v4
        with:
          name: T-Call-A7670X-V1-0-diagnostics
          path: .pio/build/T-Call-A7670X-V1-0/firmware.bin
          if-no-files-found: error
